name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, typecheck, test, and validate database schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          echo "===== COMMIT ====="
          git rev-parse HEAD

          echo "===== BRANCH ====="
          git branch --show-current

          echo "===== PRETTIER ====="
          pnpm exec prettier --version

          echo "===== README HASH ====="
          sha256sum README.md

          echo "===== README ====="
          cat README.md
          echo "===== FORMAT CHECK ====="
          pnpm exec prettier --check README.md
      - run: pnpm lint
      - run: pnpm check-types
      - run: pnpm test
      - run: pnpm db:validate
      - run: pnpm audit --prod --audit-level=high
